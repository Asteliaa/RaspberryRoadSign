[metadata]
name = RaspberryRoadSign
version = 0.1.0

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10

[options.packages.find]
where = src

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    .tox,
    .eggs,
    *.egg

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --cov=src/RaspberryRoadSign

[coverage:run]
source = src/RaspberryRoadSign
omit = 
    */tests/*
    */test_*.py
    */__init__.py
