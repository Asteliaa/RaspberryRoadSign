# =============================================================================
# Fine-tuning config — RTSD → Belarus (Camber Cloud, L4 GPU)
# =============================================================================

# ── Базовая модель ────────────────────────────────────────────────────────────
# yolov11n.pt — nano (2.6M параметров), оптимально для Raspberry Pi
# pretrained=true — transfer learning от COCO (backbone уже знает признаки)
pretrained: true

# ── Fine-tuning стратегия ─────────────────────────────────────────────────────
# freeze: 10 — замораживаем первые 10 слоёв backbone
# Почему: backbone уже обучен на общих признаках формы/цвета знаков
# Обучаем только detection head под белорусские классы
freeze: 10

epochs: 50            # 50 эпох — достаточно для fine-tuning
patience: 15          # early stopping если 15 эпох без улучшения
batch: 32             # L4 24GB легко тянет batch=32 при imgsz=416
imgsz: 416            # компромисс: лучше 320 для деталей знаков, RPi = 320
device: 0             # GPU
workers: 8            # параллельная загрузка данных
amp: true             # FP16 — 2x быстрее на L4

# ── Оптимизатор ───────────────────────────────────────────────────────────────
optimizer: AdamW      # лучше SGD для fine-tuning
lr0: 0.0005           # низкий LR — важно при fine-tuning, не ломать веса
lrf: 0.01             # финальный LR = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8

# ── Loss weights ──────────────────────────────────────────────────────────────
# box: детекция bbox. cls: классификация. dfl: Distribution Focal Loss
box: 7.5
cls: 1.0              # увеличен с 0.5 — важно для многоклассовых знаков
dfl: 1.5

# ── Аугментации ──────────────────────────────────────────────────────────────
# Специфично для дорожных знаков в реальных условиях:
hsv_h: 0.015          # небольшой сдвиг оттенка
hsv_s: 0.7            # насыщенность (разные условия освещения)
hsv_v: 0.4            # яркость (день/ночь, тень)
degrees: 10.0         # знаки могут быть под небольшим углом
translate: 0.1
scale: 0.5            # разный масштаб (знак близко/далеко)
shear: 3.0            # перспективное искажение
perspective: 0.0003   # съёмка под углом из авто
flipud: 0.0           # НЕ переворачиваем вертикально — знаки ориентированы
fliplr: 0.5           # горизонтальное зеркало — ок для большинства знаков
mosaic: 0.5           # мозаика — снижена до 0.5 (мелкие знаки теряются при 1.0)
mixup: 0.1
copy_paste: 0.1       # вставка знаков в другие сцены — полезно при малом датасете

# ── Метрики и логирование ─────────────────────────────────────────────────────
save: true
save_period: 10       # сохранять чекпойнт каждые 10 эпох
plots: true           # графики потерь и метрик
val: true
conf: 0.001           # низкий порог для валидации (чтобы видеть все классы)
iou: 0.6
label_smoothing: 0.0  # без сглаживания — у нас точные метки после ремаппинга
seed: 42
